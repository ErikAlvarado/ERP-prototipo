<mat-toolbar class="toolbar">
  <span>ZYRO IT</span>
  <span class="spacer"></span>
  @if (sesion(); as usuario) {
    <div class="usuario">
      <span><strong>{{ usuario.nombre }}</strong><small>{{ usuario.rol }}</small></span>
      <button matIconButton type="button" matTooltip="Cerrar sesion" aria-label="Cerrar sesion" (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  }
</mat-toolbar>
