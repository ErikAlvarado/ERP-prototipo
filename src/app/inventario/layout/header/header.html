<mat-toolbar class="app-header">
  <div class="brand-container">
    <div class="brand-logo-img">
      <img src="/logo.png" alt="Zyroit logo" />
    </div>
    <span class="brand-name">ZYROIT</span>
    <span class="brand-badge">{{ moduleTitle() }}</span>
  </div>

  <span class="spacer"></span>

  @if (sesion(); as usuario) {
    <div class="user-profile">
      <div class="user-avatar">{{ iniciales(usuario.nombre) }}</div>
      <div class="user-info">
        <span class="user-name">{{ usuario.nombre }}</span>
        <span class="user-role">{{ usuario.rol }}</span>
      </div>
      <button matIconButton type="button" class="logout-button" matTooltip="Cerrar sesión" aria-label="Cerrar sesión" (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  }
</mat-toolbar>
