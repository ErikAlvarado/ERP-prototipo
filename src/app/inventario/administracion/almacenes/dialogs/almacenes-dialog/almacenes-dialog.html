
<h2 mat-dialog-title>
  {{ data.mode === 'add' ? 'Agregar almacén' : 'Actualizar almacén' }}
</h2>

<mat-dialog-content>

  <div class="formulario">

    <mat-form-field appearance="outline">
      <mat-label>Clave</mat-label>
      <input matInput [(ngModel)]="almacen.clave">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre del almacén</mat-label>
      <input matInput [(ngModel)]="almacen.nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Responsable</mat-label>
      <input matInput [(ngModel)]="almacen.responsable">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput [(ngModel)]="almacen.telefono">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Dirección</mat-label>
      <textarea
        matInput
        rows="3"
        [(ngModel)]="almacen.direccion">
      </textarea>
    </mat-form-field>

    <div class="checks">
      <mat-checkbox [(ngModel)]="almacen.estado">
        Activo
      </mat-checkbox>
    </div>

  </div>

</mat-dialog-content>

<mat-dialog-actions>

  <button mat-button mat-dialog-close>
    Cancelar
  </button>

  <button
    mat-flat-button
    color="primary"
    (click)="guardar()">

    {{ data.mode === 'add' ? 'Guardar' : 'Actualizar' }}

  </button>

</mat-dialog-actions>
