<div class="content-header">
    <h1>Lista de Empresas</h1>

    <button
        mat-raised-button
        color="primary"
        (click)="abrirDialogo()">
        Agregar Empresa
    </button>
</div>

<div class="content-search">

    <mat-form-field class="search-field" appearance="outline">
        <mat-icon matPrefix>search</mat-icon>

        <input
            [(ngModel)]="currentSearch"
            (keyup)="applyFilter()"
            matInput
            placeholder="Nombre / RFC">
    </mat-form-field>

    <mat-form-field class="select-field" appearance="outline">

        <mat-label>Estado</mat-label>

        <mat-select
            [(ngModel)]="currentStatus"
            (selectionChange)="applyFilter()">

            <mat-option value="">Todas</mat-option>
            <mat-option value="true">Activas</mat-option>
            <mat-option value="false">Inactivas</mat-option>

        </mat-select>

    </mat-form-field>

</div>

<div class="table-responsive">

    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

        <ng-container matColumnDef="empresa">
            <th mat-header-cell *matHeaderCellDef>Empresa</th>

            <td mat-cell *matCellDef="let element">
                {{element.empresa}}
            </td>
        </ng-container>

        <ng-container matColumnDef="razonSocial">
            <th mat-header-cell *matHeaderCellDef>Razón Social</th>

            <td mat-cell *matCellDef="let element">
                {{element.razonSocial}}
            </td>
        </ng-container>

        <ng-container matColumnDef="rfc">
            <th mat-header-cell *matHeaderCellDef>RFC</th>

            <td mat-cell *matCellDef="let element">
                {{element.rfc}}
            </td>
        </ng-container>

        <ng-container matColumnDef="telefono">
            <th mat-header-cell *matHeaderCellDef>Teléfono</th>

            <td mat-cell *matCellDef="let element">
                {{element.telefono}}
            </td>
        </ng-container>

        <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>

            <td mat-cell *matCellDef="let element">
                <app-status [active]="element.estado"></app-status>
            </td>
        </ng-container>

        <ng-container matColumnDef="acciones">

            <th mat-header-cell *matHeaderCellDef></th>

            <td mat-cell *matCellDef="let element">

                <button
                    mat-icon-button
                    color="primary"
                    (click)="editar(element)">
                    <mat-icon>edit</mat-icon>
                </button>

            </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

</div>
