<h2 mat-dialog-title>
  {{ data.mode === 'add' ? 'Agregar usuario' : 'Actualizar usuario' }}
</h2>

<mat-dialog-content>

  <div class="formulario">

    <mat-form-field appearance="outline">
      <mat-label>Nombre completo</mat-label>
      <input matInput [(ngModel)]="usuario.nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Usuario</mat-label>
      <input matInput [(ngModel)]="usuario.usuario">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo electrónico</mat-label>
      <input
        matInput
        type="email"
        [(ngModel)]="usuario.correo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput [(ngModel)]="usuario.telefono">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        type="password"
        [(ngModel)]="usuario.password">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>

      <mat-select [(ngModel)]="usuario.rol">

        <mat-option value="Administrador">Administrador</mat-option>
        <mat-option value="Gerente">Gerente</mat-option>
        <mat-option value="Cajero">Cajero</mat-option>
        <mat-option value="Almacenista">Almacenista</mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Almacén</mat-label>

      <mat-select [(ngModel)]="usuario.almacen">

        <mat-option value="Principal">Principal</mat-option>
        <mat-option value="Norte">Norte</mat-option>
        <mat-option value="Sur">Sur</mat-option>

      </mat-select>

    </mat-form-field>

    <div class="checks">

      <mat-checkbox [(ngModel)]="usuario.estado">
        Activo
      </mat-checkbox>

    </div>

  </div>

</mat-dialog-content>

<mat-dialog-actions>

  <button mat-button mat-dialog-close>
    Cancelar
  </button>

  <button
    mat-flat-button
    color="primary"
    (click)="guardar()">

    {{ data.mode === 'add' ? 'Guardar' : 'Actualizar' }}

  </button>

</mat-dialog-actions>
