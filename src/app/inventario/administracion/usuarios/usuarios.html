<div class="content-header">
  <h1>Lista de Usuarios</h1>
<button
  mat-raised-button
  color="primary"
  (click)="abrirDialogo()">
  Agregar Usuario
</button>
</div>

<div class="content-search">

  <mat-form-field class="search-field" appearance="outline">
    <mat-icon matPrefix>search</mat-icon>
    <input
      [(ngModel)]="currentSearch"
      (keyup)="applyFilter()"
      matInput
      placeholder="Nombre / Usuario / Correo">
  </mat-form-field>

  <mat-form-field class="select-field" appearance="outline">
    <mat-label>Rol</mat-label>
    <mat-select
      [(ngModel)]="currentRole"
      (selectionChange)="applyFilter()">

      <mat-option value="">Todos</mat-option>
      <mat-option value="Administrador">Administrador</mat-option>
      <mat-option value="Gerente">Gerente</mat-option>
      <mat-option value="Cajero">Cajero</mat-option>
      <mat-option value="Almacenista">Almacenista</mat-option>

    </mat-select>
  </mat-form-field>

</div>

<table mat-table [dataSource]="dataSource" class="mat-shadow-2">

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let element">{{element.nombre}}</td>
  </ng-container>

  <ng-container matColumnDef="usuario">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let element">{{element.usuario}}</td>
  </ng-container>

  <ng-container matColumnDef="correo">
    <th mat-header-cell *matHeaderCellDef>Correo</th>
    <td mat-cell *matCellDef="let element">{{element.correo}}</td>
  </ng-container>

  <ng-container matColumnDef="rol">
    <th mat-header-cell *matHeaderCellDef>Rol</th>
    <td mat-cell *matCellDef="let element">{{element.rol}}</td>
  </ng-container>

  <ng-container matColumnDef="almacen">
    <th mat-header-cell *matHeaderCellDef>Almacén</th>
    <td mat-cell *matCellDef="let element">{{element.almacen}}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let element">
      <app-status [active]="element.estado"></app-status>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">

      <button
        mat-icon-button
        color="primary"
        (click)="editar(element)">
        <mat-icon>edit</mat-icon>
      </button>
      
      <button
        mat-icon-button
        color="warn"
        (click)="eliminar(element)">
        <mat-icon>delete</mat-icon>
      </button>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
