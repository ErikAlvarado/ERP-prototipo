<h2 mat-dialog-title>{{ data.mode === 'add' ? 'Agregar medida' : 'Actualizar medida' }}</h2>
<mat-dialog-content>
  <div class="formulario">
    <mat-form-field appearance="outline"><mat-label>Valor</mat-label><input matInput type="number" min="0.0001" step="any" [(ngModel)]="medida.valor" required></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Unidad</mat-label><mat-select [(ngModel)]="medida.unidadId" required>@for (unidad of data.unidades; track unidad.id) { <mat-option [value]="unidad.id">{{ unidad.nombre }} ({{ unidad.abreviatura }})</mat-option> }</mat-select></mat-form-field>
    <div class="checks"><mat-checkbox [(ngModel)]="medida.estado">Medida activa</mat-checkbox></div>
    @if (error) { <p class="error-text full-width">{{ error }}</p> }
  </div>
</mat-dialog-content>
<mat-dialog-actions><button mat-raised-button mat-dialog-close>Cancelar</button><button mat-raised-button color="primary" (click)="guardar()">{{ data.mode === 'add' ? 'Guardar' : 'Actualizar' }}</button></mat-dialog-actions>
