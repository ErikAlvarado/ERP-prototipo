<div class="content-header">
    <h1>Lista de Medidas</h1>

    <button
        mat-raised-button
        color="primary"
        (click)="abrirAgregar()">

        Agregar medida

    </button>
</div>

<div class="content-search">

    <mat-form-field class="search-field" appearance="outline">
        <mat-icon matPrefix>search</mat-icon>

        <input
            [(ngModel)]="currentSearch"
            (keyup)="applyFilter()"
            matInput
            placeholder="Buscar medida">
    </mat-form-field>

    <mat-form-field class="select-field" appearance="outline">
        <mat-label>Unidad</mat-label>

        <mat-select
            [(ngModel)]="currentUnit"
            (selectionChange)="applyFilter()">

            <mat-option value="">Todas</mat-option>
            <mat-option value="Pieza">Pieza</mat-option>
            <mat-option value="Metro">Metro</mat-option>
            <mat-option value="Kilogramo">Kilogramo</mat-option>
            <mat-option value="Litro">Litro</mat-option>

        </mat-select>
    </mat-form-field>

</div>

<div class="table-responsive">

    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

        <ng-container matColumnDef="valor">
            <th mat-header-cell *matHeaderCellDef>Valor</th>

            <td mat-cell *matCellDef="let element">
                {{element.valor}}
            </td>
        </ng-container>

        <ng-container matColumnDef="unidad">
            <th mat-header-cell *matHeaderCellDef>Unidad</th>

            <td mat-cell *matCellDef="let element">
                {{element.unidad}}
            </td>
        </ng-container>

        <ng-container matColumnDef="acciones">

            <th mat-header-cell *matHeaderCellDef></th>

            <td mat-cell *matCellDef="let element">

                <button
            mat-icon-button
            color="primary"
            (click)="editar(element)">

            <mat-icon>edit</mat-icon>

            </button>


            <button
            mat-icon-button
            color="warn"
            (click)="eliminar(element)">

            <mat-icon>delete</mat-icon>

            </button>

            </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

</div>
