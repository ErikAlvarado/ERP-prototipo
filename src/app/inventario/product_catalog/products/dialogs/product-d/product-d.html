<div class="dialog-container">
  

  <div class="dialog-header">
    <h2>{{ data.mode === 'add' ? 'Crear Producto' : 'Actualizar Producto' }}</h2>
    <button mat-icon-button (click)="cerrar()">
      <mat-icon>close</mat-icon>
    </button>
  </div>


  <div class="dialog-content">
    

    <div class="card-section">
      <label class="section-label">Tipo</label>
      <div class="chips-group">
        <button class="chip" [class.active]="producto.tipo === 'Producto'" (click)="producto.tipo = 'Producto'">Producto</button>
        <button class="chip" [class.active]="producto.tipo === 'Servicio'" (click)="producto.tipo = 'Servicio'">Servicio</button>
      </div>
    </div>


    <div class="card-section grid-layout">
      
      <div class="input-group full-width">
        <label>Nombre*</label>
        <input class="custom-input" [(ngModel)]="producto.producto" placeholder="Ej: Jabón de mano">
      </div>

      <div class="input-group">
        <label>SKU</label>
        <input class="custom-input" [(ngModel)]="producto.sku" placeholder="Ej: PROD-001">
      </div>

      <div class="input-group">
        <label>Código de barras</label>
        <input class="custom-input" [(ngModel)]="producto.codigo" placeholder="Opcional">
      </div>

      <div class="input-group">
        <label>Marca</label>
        <select class="custom-select" [(ngModel)]="producto.marca">
          <option value="" disabled selected>Selecciona una marca</option>
          <option value="Marca A">Marca A</option>
          <option value="Marca B">Marca B</option>
          <option value="Marca C">Marca C</option>
          <option value="Truper">Truper</option>
          <option value="WD-40">WD-40</option>
        </select>
      </div>

      <div class="input-group">
        <label>Categoría</label>
        <select class="custom-select" [(ngModel)]="producto.categoria">
          <option value="" disabled selected>Buscar o crear categoría</option>
          <option value="Cableado">Cableado</option>
          <option value="Hardware">Hardware</option>
          <option value="Herramientas">Herramientas</option>
          <option value="Iluminación">Iluminación</option>
        </select>
      </div>

    </div>

    <div class="card-section grid-layout">
      
      <div class="input-group">
        <label>Precio de venta</label>
        <div class="input-with-prefix">
          <span class="prefix">$</span>
          <input class="custom-input pl-prefix" type="number" [(ngModel)]="producto.precio" placeholder="0.00">
          <span class="suffix">por {{ producto.medida || 'Unidad' }}</span>
        </div>
        <span class="hint">Incluyendo impuestos</span>
      </div>

      <div class="input-group">
        <label>Unidad de medida</label>
        <select class="custom-select" [(ngModel)]="producto.medida">
          <option value="Pieza">Pieza</option>
          <option value="Caja">Caja</option>
          <option value="Paquete">Paquete</option>
          <option value="Kit">Kit</option>
        </select>
      </div>

    </div>

    <div class="card-section">
      <label class="section-label" style="margin-bottom: 12px;">Configuraciones de visibilidad</label>
      <div class="checkbox-group">
        
        <label class="custom-checkbox">
          <input type="checkbox" [(ngModel)]="producto.pos">
          <span class="checkmark"></span> Punto de venta
        </label>

        <label class="custom-checkbox">
          <input type="checkbox" [(ngModel)]="producto.linea">
          <span class="checkmark"></span> Tienda en línea
        </label>

        <label class="custom-checkbox">
          <input type="checkbox" [(ngModel)]="producto.estado">
          <span class="checkmark"></span> Activo
        </label>

      </div>
    </div>

  </div>

  <div class="dialog-footer">

    <div class="footer-actions">
      <button mat-stroked-button class="btn-cancelar" (click)="cerrar()">
        Cancelar
      </button>
      <button mat-flat-button class="btn-guardar" (click)="guardar()">
        {{ data.mode === 'add' ? 'Crear Producto' : 'Actualizar' }}
      </button>
    </div>

  </div>

</div>
