<h2 mat-dialog-title>
  {{ data.mode === 'add' ? 'Agregar producto' : 'Actualizar producto' }}
</h2>

<mat-dialog-content>

  <div class="formulario">

    <mat-form-field appearance="outline">
      <mat-label>SKU</mat-label>
      <input matInput [(ngModel)]="producto.sku">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Código de barras</mat-label>
      <input matInput [(ngModel)]="producto.codigo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Producto</mat-label>
      <input matInput [(ngModel)]="producto.producto">
    </mat-form-field>

    <mat-form-field appearance="outline">
    <mat-label>Marca</mat-label>

        <mat-select [(ngModel)]="producto.marca">

            <mat-option value="Marca A">Marca A</mat-option>
            <mat-option value="Marca B">Marca B</mat-option>
            <mat-option value="Marca C">Marca C</mat-option>

        </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">
    <mat-label>Categoría</mat-label>

        <mat-select [(ngModel)]="producto.categoria">

            <mat-option value="Cableado">Cableado</mat-option>
            <mat-option value="Hardware">Hardware</mat-option>
            <mat-option value="Herramientas">Herramientas</mat-option>

        </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Unidad de medida</mat-label>

        <mat-select [(ngModel)]="producto.medida">

            <mat-option value="Pieza">Pieza</mat-option>
            <mat-option value="Caja">Caja</mat-option>
            <mat-option value="Paquete">Paquete</mat-option>

        </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio</mat-label>
      <input matInput type="number" [(ngModel)]="producto.precio">
    </mat-form-field>

    <div class="checks">

      <mat-checkbox [(ngModel)]="producto.pos">
        Punto de venta
      </mat-checkbox>

      <mat-checkbox [(ngModel)]="producto.linea">
        Tienda en línea
      </mat-checkbox>

      <mat-checkbox [(ngModel)]="producto.estado">
        Activo
      </mat-checkbox>

    </div>

  </div>

</mat-dialog-content>

<mat-dialog-actions>

  <button mat-button mat-dialog-close>
    Cancelar
  </button>

  <button
    mat-flat-button
    color="primary"
    (click)="guardar()">

    {{ data.mode === 'add' ? 'Guardar' : 'Actualizar' }}

  </button>

</mat-dialog-actions>
