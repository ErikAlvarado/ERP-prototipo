<div class="dialog-container">
  <div class="dialog-header">
    <div>
      <span class="eyebrow">Filtros avanzados</span>
      <h2>{{ data.titulo }}</h2>
    </div>
    <button mat-icon-button aria-label="Cerrar filtros" (click)="cerrar()"><mat-icon>close</mat-icon></button>
  </div>

  <div class="dialog-content">
    <div class="filters-grid">
      @for (campo of data.campos; track campo.clave) {
        <div class="filter-control">
          <label [for]="'filter-' + campo.clave"><mat-icon>{{ campo.icono }}</mat-icon>{{ campo.etiqueta }}</label>
          @if (campo.tipo === 'number') {
            <input
              class="custom-input"
              [id]="'filter-' + campo.clave"
              type="number"
              [min]="campo.minimo ?? 0"
              step="0.01"
              [placeholder]="campo.placeholder || campo.etiqueta"
              [(ngModel)]="filtros[campo.clave]">
          } @else {
            <select class="custom-select" [id]="'filter-' + campo.clave" [(ngModel)]="filtros[campo.clave]">
              <option value="">Todos</option>
              @for (opcion of campo.opciones || []; track opcion.valor) {
                <option [value]="opcion.valor">{{ opcion.etiqueta }}</option>
              }
            </select>
          }
        </div>
      }
    </div>
  </div>

  <div class="dialog-footer">
    <button mat-stroked-button class="btn-limpiar" (click)="limpiar()">
      Limpiar{{ conteoFiltros ? ' (' + conteoFiltros + ')' : '' }}
    </button>
    <button mat-flat-button color="primary" class="btn-resultados" (click)="aplicar()">Aplicar filtros</button>
  </div>
</div>
