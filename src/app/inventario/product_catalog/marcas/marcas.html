<div class="content-header">
    <h1>Lista de Marcas</h1>
    <button
        mat-raised-button
        color="primary"
        (click)="abrirAgregar()">

        Agregar marca

    </button>
</div>

<div class="content-search">

    <mat-form-field class="search-field" appearance="outline">
        <mat-icon matPrefix>search</mat-icon>
        <input
            [(ngModel)]="currentSearch"
            (keyup)="applyFilter()"
            matInput
            placeholder="Buscar marca">
    </mat-form-field>

    <mat-form-field class="select-field" appearance="outline">
        <mat-label>Estado</mat-label>

        <mat-select
            [(ngModel)]="currentStatus"
            (selectionChange)="applyFilter()">

            <mat-option value="">Todos</mat-option>
            <mat-option value="true">Activos</mat-option>
            <mat-option value="false">Inactivos</mat-option>

        </mat-select>
    </mat-form-field>

</div>

<div class="table-responsive">

    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>
                Marca
            </th>

            <td mat-cell *matCellDef="let element">
                {{element.nombre}}
            </td>
        </ng-container>

        <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>
                Estado
            </th>

            <td mat-cell *matCellDef="let element">
                <app-status [active]="element.estado"></app-status>
            </td>
        </ng-container>

        <ng-container matColumnDef="acciones">

            <th mat-header-cell *matHeaderCellDef></th>

            <td mat-cell *matCellDef="let element">

            <button
                mat-icon-button
                color="primary"
                (click)="editar(element)">

                <mat-icon>edit</mat-icon>

            </button>


            <button
                mat-icon-button
                color="warn"
                (click)="eliminar(element)">

                <mat-icon>delete</mat-icon>

            </button>

            </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

</div>
