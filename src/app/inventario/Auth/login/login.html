<div class="container">
  <mat-card class="card">
    <mat-card-header><mat-card-title>Iniciar sesion</mat-card-title></mat-card-header>
    <mat-card-content>
      <form class="cont-form" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Correo electronico</mat-label>
          <input type="email" matInput formControlName="correo" autocomplete="email" />
          <mat-error>Escribe un correo valido</mat-error>
        </mat-form-field>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Contrasena</mat-label>
          <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <button matIconButton matSuffix type="button" (click)="clickEvent($event)" [attr.aria-label]="hide() ? 'Mostrar contrasena' : 'Ocultar contrasena'">
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        @if (error()) { <p class="error-sesion" role="alert">{{ error() }}</p> }
        <button mat-raised-button color="primary" class="full-width" type="submit">Iniciar sesion</button>
        <p>¿Aun no tienes una cuenta? <a routerLink="/register">Registrate</a></p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
