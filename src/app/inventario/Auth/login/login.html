<div class="container">
    <mat-card class="card">
        <mat-card-header>
            <mat-card-title>Inicio de sesión</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
            <form class="cont-form">
            <mat-form-field class="full-width">
                <mat-label>Email</mat-label>
                <input type="email" matInput [formControl]="emailFormControl" [errorStateMatcher]="matcher"
                    placeholder="Ex. pat@example.com">
                <mat-hint>Errors appear instantly!</mat-hint>
                @if (emailFormControl.hasError('email') && !emailFormControl.hasError('required')) {
                <mat-error>Please enter a valid email address</mat-error>
                }
                @if (emailFormControl.hasError('required')) {
                <mat-error>Email is <strong>required</strong></mat-error>
                }

            </mat-form-field>

            <div class="container" class="full-width">
            <mat-form-field class="full-width">
                <mat-label>Enter your password</mat-label>
                <input matInput [type]="hide() ? 'password' : 'text'"/>
                <button
                matIconButton
                matSuffix
                (click)="clickEvent($event)"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide()"
                >
                <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            </div>

            <button mat-raised-button color="primary" class="full-width">Iniciar sesión</button>

            <p>
                ¿Aun no cuentas con una cuenta? <a matButton="elevated" routerLink="/register" href="javascript():void(0)">Registrate</a>
            </p>
            </form>
        </mat-card-content>
    </mat-card>
</div>
