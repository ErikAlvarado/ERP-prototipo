<div class="container">
  <mat-card class="card">
    <mat-card-header><mat-card-title>Crear cuenta</mat-card-title></mat-card-header>
    <mat-card-content>
      <form class="cont-form" [formGroup]="formulario" (ngSubmit)="registrar()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Nombre completo</mat-label>
          <input matInput formControlName="nombre" autocomplete="name">
        </mat-form-field>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Correo electronico</mat-label>
          <input matInput type="email" formControlName="correo" autocomplete="email">
        </mat-form-field>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Contrasena</mat-label>
          <input matInput type="password" formControlName="contrasena" autocomplete="new-password">
          <mat-hint>Minimo 8 caracteres</mat-hint>
        </mat-form-field>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Area</mat-label>
          <mat-select formControlName="rol">
            <mat-option value="Inventario">Inventario</mat-option>
            <mat-option value="Comprador">Compras</mat-option>
          </mat-select>
        </mat-form-field>
        @if (error()) { <p class="error-sesion" role="alert">{{ error() }}</p> }
        <button mat-raised-button color="primary" class="full-width" type="submit">Registrar</button>
        <a mat-button routerLink="/login">Volver al inicio de sesion</a>
      </form>
    </mat-card-content>
  </mat-card>
</div>
